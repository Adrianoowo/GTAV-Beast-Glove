; ==================================================
; GTA V Legacy - BEAST GLOVE MOD (ERO Compatible)
; Natural Euphoria Launch Physics for Knuckle Duster
; ==================================================

[Physics]
; Initial ped launch speed in m/s (28 m/s ~ 100 km/h produces an authentic 70-80m arc)
LaunchSpeed = 68.0
; Launch angle in degrees (45.0 for maximum natural projectile arc)
LaunchAngle = 28.0
; Natural rotational torque so targets somersault realistically in the air
SpinTorque = 12.0

[Combat]
; Punch damage dealt to target (default 1 to keep peds alive so Euphoria active ragdoll flails in the air)
PunchDamage = 1

[Effects]
; Sonic air-burst particle ring (no fire/explosions)
PlayShockwaveFx = true
; Impact audio blast
PlaySoundFx = true
; Punch camera shake
CameraShake = true

[Vehicles]
; Launch vehicles when punched with Knuckle Duster
AffectVehicles = true
; Vehicle launch speed in m/s (18 m/s gives a realistic 30-40m dramatic airborne tumble)
VehicleLaunchSpeed = 18.0
; Vehicle spin torque for airborne barrel-rolls
VehicleSpinTorque = 2.2
