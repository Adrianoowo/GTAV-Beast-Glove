; ====================================================================
; GTA V Legacy - BEAST GLOVE MOD (ERO Compatible)
; Natural Euphoria Launch Physics for Knuckle Duster
; ====================================================================

[Physics]
; Initial launch speed in m/s
LaunchSpeed = 38.0

; Launch angle in degrees (45.0 for natural parabolic arc)
LaunchAngle = 45.0

; Bone impulse multiplier for ragdoll takeoff
ForceMultiplier = 40.0

; Natural rotational spin torque so targets backflip and corkscrew
SpinTorque = 3.5

[Combat]
; Base punch damage (keeps target alive so Euphoria flailing is visible)
PunchDamage = 25

[Effects]
; Sonic air-burst dust shockwave (no fire/explosions)
PlayShockwaveFx = true

; Heavy impact audio blast
PlaySoundFx = true

; Punch camera shake
CameraShake = true

[Vehicles]
; Launch vehicles when punched with Knuckle Duster
AffectVehicles = true

; Vehicle speed multiplier
VehicleSpeedMultiplier = 0.85
