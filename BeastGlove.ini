; ====================================================================
; GTA V Legacy - BEAST GLOVE MOD (ERO Compatible)
; Simulates the BEAST Glove effects using the Knuckle Duster
; Launches hit targets ~100m at ~45° angle with full Euphoria physics
; ====================================================================

[Physics]
; Base launch speed in m/s (48.0 achieves ~100 meters at a 45° angle under GTA V ragdoll drag)
LaunchSpeed = 48.0

; Upward launch angle in degrees (45.0 degrees is optimal for maximum projectile range)
LaunchAngle = 45.0

; Physics impulse multiplier applied to ragdoll skeleton (ensures massive takeoff)
ForceMultiplier = 55.0

; Total ragdoll duration in milliseconds to keep the ped in flight
RagdollDurationMs = 8000

[Combat]
; Damage dealt per Beast Glove punch (set to 20 so targets survive the hit and fly)
PunchDamage = 20

[Effects]
; Sonic air-burst dust shockwave particle effect on punch connection (no fire/grenades)
PlayShockwaveFx = true

; Heavy impact / parachute-pop air boom audio feedback
PlaySoundFx = true

; Physical camera shake on hit
CameraShake = true

[Vehicles]
; Whether punching vehicles also launches them into the air
AffectVehicles = true

; Speed multiplier for vehicles
VehicleSpeedMultiplier = 0.85

[General]
; Show on-screen notification when Knuckle Duster is equipped
ShowEquipNotification = true

; Show on-screen notification when a Beast Punch lands
ShowHitNotification = true

; Hotkey to quickly spawn/equip the Knuckle Duster (default: B)
EquipHotkey = B
